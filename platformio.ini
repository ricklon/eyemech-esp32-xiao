; eyemech-esp32-xiao — Seeed XIAO ESP32-S3, ESP-IDF via PlatformIO
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
; Config:  pio run -t menuconfig

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
    -DEYEMECH_VERSION=\"0.1.0\"

; Uncomment and set once you know which port Windows assigns the board.
; upload_port = COM5
; monitor_port = COM5
