; eyemech-esp32-xiao — ESP-IDF port of the MicroPython eye mechanism.
;
; Two targets, one codebase. Pin differences live in components/board.
;   pio run -e xiao_esp32c6            build for the C6 (the board it runs on today)
;   pio run -e xiao_esp32s3 -t upload  build and flash the S3
;   pio device monitor

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
build_flags = -DEYEMECH_VERSION=\"0.2.0\"

[env:xiao_esp32c6]
board = seeed_xiao_esp32c6
build_flags = ${env.build_flags} -DEYEMECH_BOARD_XIAO_C6=1

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DEYEMECH_BOARD_XIAO_S3=1
